name: Live Market-Hours Trading Loop

on:
  schedule:
    # GitHub Actions cron is UTC-only and doesn't shift for US daylight saving.
    # Firing at :30 past the hour lines up with the 9:30am ET open in both
    # EDT (UTC-4: 13:30 -> 9:30am) and EST (UTC-5: 14:30 -> 9:30am), giving
    # ticks at 9:30, 10:30, ..., 15:30 ET either way (16:30 falls after the
    # 4:00pm close and is a no-op). The actual go/no-go decision is made in
    # Python via zoneinfo (DST-correct), so any tick outside real market
    # hours just checks the clock and exits immediately.
    - cron: '30 13-21 * * 1-5' # Hourly at :30 past, ~9:30am-5:30pm ET depending on DST, Mon-Fri
  workflow_dispatch: # Allow manual triggers

concurrency:
  group: live-trading-loop
  cancel-in-progress: false # queue rather than overlap, so state/git writes never race

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8 # keep a stuck tick from blocking the next scheduled one for long
    permissions:
      contents: write # To push changes back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r v2/requirements.txt

      - name: Run Live Market Tick
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -m v2.live_runner

      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Live tick: ${{ github.event.schedule || 'Manual Run' }}"
          file_pattern: 'v2/data/snapshots/*.json v2/data/portfolios/*.json v1/logs/*'
          branch: main
